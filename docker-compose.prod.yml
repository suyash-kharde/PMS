# Server deployment. Everything that must survive a rebuild is a bind mount under ./data,
# so the whole install is one directory you can tar, rsync or snapshot.
#
#   ./              -> /app                        source code
#   ./data/postgres -> /var/lib/postgresql/data     database
#   ./data/models   -> /models                      model weights (HF cache)
#   ./media         -> /app/media                   uploads + provider TLS certs
#
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
# GPU:    add  -f docker-compose.gpu.yml              (see DEPLOY.md)
# Hosts:  add  -f docker-compose.hosts-override.yml    if your LLM/ASR/embedding/reranker
#              endpoints live behind hostnames with no public DNS record (see that file)
#
# db runs pgvector/pgvector:pg16 (Postgres 16 + the vector extension, for Ask AI's RAG
# index) -- not a named Docker volume, just Postgres 16 either way. web/worker run under
# uvicorn's gunicorn worker class, not plain WSGI: the chat page holds a WebSocket open,
# which a sync worker cannot serve at all.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pms}
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # app tables + the Django cache table `pms_cache`
      - ./data/postgres:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c max_connections=200
      -c superuser_reserved_connections=5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms} -d ${POSTGRES_DB:-pms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # not published: only the compose network reaches the database. Uncomment to expose.
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: pms_web
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./:/app
      - ./data/staticfiles:/app/staticfiles
      - ./data/secrets:/app/secrets
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # gunicorn, not runserver: runserver is single-threaded and not for production use.
    # ASGI via uvicorn's worker class, not the sync WSGI one: the chat page holds a
    # long-lived WebSocket open, which a sync worker can't serve at all. --timeout=0
    # disables gunicorn's silence-timeout, which otherwise kills a worker sitting on
    # an idle-but-healthy WebSocket waiting for the next question.
    command:
      - gunicorn
      - config.asgi:application
      - -k
      - uvicorn_worker.UvicornWorker
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-3}
      - --timeout=0
      - --access-logfile=-
      - --error-logfile=-

  # background pipeline: denoise -> ASR + diarization -> BRD regeneration
  worker:
    build: .
    container_name: pms_worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "0"
      SEED_DEMO: "0"
      SEED_CONFIG: "0"
    volumes:
      - ./:/app
      - ./data/secrets:/app/secrets
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    command: ["python", "manage.py", "process_queue", "--loop"]

  # Project sites gateway: /sites/<name>/ -> a project's VM (Go, see gateway/). Separate on purpose:
  # if it stops or crashes only /sites/ is affected; nginx looks it up per request and Planwise does
  # not depend on it. No published port: only nginx (and Planwise, to register sites) reach it.
  gateway:
    build: ./gateway
    container_name: pms_gateway
    restart: unless-stopped
    environment:
      TLS: "false"
      LISTEN: ":8080"
      BASE_PATH: /sites
      ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN in .env}
      GW_DEBUG_AUTH: ${GW_DEBUG_AUTH:-0}
    volumes:
      - gateway-data:/data
    expose:
      - "8080"
    mem_limit: 512m
    cpus: 1.0

  # TLS terminator: self-signed cert on first boot, proxies to Django.
  # HTTPS is what makes the service worker + Push API work off localhost.
  proxy:
    build: ./services/proxy
    container_name: pms_proxy
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CERT_HOST: ${CERT_HOST:?CERT_HOST must be your server hostname}
      # extra names/IPs the self-signed cert should also cover (comma-separated)
      CERT_SAN: ${CERT_SAN:-}
    volumes:
      - ./data/certs:/etc/nginx/certs
      - ./data/staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"

  # OpenAI-compatible noise reduction — weya-ai/hush
  denoise:
    build:
      context: ./services/denoise
      args:
        INSTALL_HUSH: ${INSTALL_HUSH:-0}
    container_name: pms_denoise
    restart: unless-stopped
    environment:
      ENGINE: ${DENOISE_ENGINE:-auto}
      DENOISE_MODEL: ${DENOISE_MODEL:-weya-ai/hush}
      HF_HOME: /models
    volumes:
      - ./data/models:/models
    expose:
      - "8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # OpenAI-compatible ASR + speaker diarization
  asr:
    build:
      context: ./services/asr
      args:
        INSTALL_DIARIZER: ${INSTALL_DIARIZER:-1}
    container_name: pms_asr
    restart: unless-stopped
    environment:
      # ASR: remote OpenAI-compatible endpoint (multi-language)
      ASR_MODEL: ${ASR_MODEL:-Qwen/Qwen3-ASR-0.6B}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-cant-be-empty}
      ASR_BACKEND: ${ASR_BACKEND:-remote}
      # the only model that runs locally: speaker diarization
      DIAR_MODEL: ${DIAR_MODEL:-pyannote/speaker-diarization-3.1}
      DIARIZER: ${DIARIZER:-auto}
      DIAR_DEVICE: ${DIAR_DEVICE:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
      MAX_CHUNK_SECONDS: ${MAX_CHUNK_SECONDS:-25}
      HF_HOME: /models
    volumes:
      # diarizer weights download here once and are reused across rebuilds
      - ./data/models:/models
      # certificates uploaded on the AI models page live here
      - ./media:/app/media:ro
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # the gateway's app list (rebuilt from Planwise automatically if lost)
  gateway-data:
