<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gateway Admin</title>
<style>
  body{font:15px system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#222}
  input[type=text],input[type=password]{padding:.4rem;border:1px solid #bbb;border-radius:4px}
  button{padding:.4rem .8rem;border:1px solid #888;border-radius:4px;background:#f4f4f4;cursor:pointer}
  table{border-collapse:collapse;width:100%;margin:1rem 0}
  th,td{border-bottom:1px solid #ddd;padding:.5rem;text-align:left}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
  #err{color:#b00020}
</style>
<h1>Gateway Admin</h1>
<div class="row">
  <input id="token" type="password" placeholder="admin token" size="34">
  <button id="login">Load</button>
</div>
<p id="err"></p>

<table>
  <thead><tr><th>Path</th><th>Target</th><th>Insecure TLS</th><th>Rewrite HTML</th><th>Rewrite JS</th><th></th></tr></thead>
  <tbody id="apps"></tbody>
</table>

<h3>Add / update app</h3>
<div class="row">
  <input id="name" type="text" placeholder="name (app1)" size="14">
  <input id="target" type="text" placeholder="http://172.16.16.38:442" size="34">
  <label><input id="insecure" type="checkbox"> skip backend TLS verify</label>
  <label><input id="rewrite" type="checkbox"> rewrite HTML links</label>
  <label><input id="rewritejs" type="checkbox"> rewrite JS</label>
  <label><input id="isolate" type="checkbox"> isolate storage</label>
  <input id="synctokens" type="text" placeholder="sync token cookies: accessToken,refreshToken" size="36">
  <input id="mounts" type="text" placeholder="extra mounts: /_api=http://host:8039, ..." size="44">
  <button id="add">Save</button>
</div>

<script>
const $ = id => document.getElementById(id);
$('token').value = sessionStorage.getItem('tok') || '';

async function api(method, path, body) {
  const r = await fetch('/_admin/api/' + path, {
    method,
    headers: {'Authorization': 'Bearer ' + $('token').value, 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function load() {
  $('err').textContent = '';
  try {
    sessionStorage.setItem('tok', $('token').value);
    const apps = await api('GET', 'apps');
    const tb = $('apps');
    tb.replaceChildren();
    for (const a of apps) {
      const tr = document.createElement('tr');
      const link = document.createElement('a');
      link.href = '/' + a.name + '/'; link.textContent = '/' + a.name + '/';
      const c1 = document.createElement('td'); c1.append(link);
      const c2 = document.createElement('td'); c2.textContent = a.target + (a.mounts || []).map(m => '\n+ ' + m.path + ' -> ' + m.target).join('');
      c2.style.whiteSpace = 'pre-line';
      const c3 = document.createElement('td'); c3.textContent = a.insecure ? 'yes' : 'no';
      const c4 = document.createElement('td'); c4.textContent = a.rewrite_html ? 'yes' : 'no';
      const c4b = document.createElement('td'); c4b.textContent = a.rewrite_js ? 'yes' + (a.isolate_storage ? ' + isolated storage' : '') : 'no';
      const c5 = document.createElement('td');
      const del = document.createElement('button'); del.textContent = 'Delete';
      del.onclick = async () => {
        if (!confirm('Delete ' + a.name + '?')) return;
        try { await api('DELETE', 'apps/' + encodeURIComponent(a.name)); load(); }
        catch (e) { $('err').textContent = e.message; }
      };
      c5.append(del);
      tr.append(c1, c2, c3, c4, c4b, c5);
      tb.append(tr);
    }
  } catch (e) { $('err').textContent = e.message; }
}

$('login').onclick = load;
$('add').onclick = async () => {
  $('err').textContent = '';
  try {
    await api('POST', 'apps', {
      name: $('name').value, target: $('target').value,
      insecure: $('insecure').checked, rewrite_html: $('rewrite').checked, rewrite_js: $('rewritejs').checked, isolate_storage: $('isolate').checked, sync_tokens: $('synctokens').value.trim(),
      mounts: $('mounts').value.split(',').map(s => s.trim()).filter(Boolean).map(s => { const i = s.indexOf('='); return {path: s.slice(0, i).trim(), target: s.slice(i + 1).trim()}; }),
    });
    $('name').value = ''; $('target').value = ''; $('mounts').value = '';
    load();
  } catch (e) { $('err').textContent = e.message; }
};
if ($('token').value) load();
</script>
