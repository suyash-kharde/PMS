{% extends "base.html" %}
{% block title %}{{ title }} · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <p class="crumbs">
      <a href="{% url 'sprints:sprint_list' %}">Sprints</a> /
      <a href="{{ requirement.get_absolute_url }}">{{ requirement.key }}</a> / {{ title }}
    </p>
    <h1>{{ title }}</h1>
  </div>
</div>

<form class="card form-grid" method="post">
  {% csrf_token %}
  {% include "sprints/_form_body.html" %}
  <div class="form-actions span-2">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a>
  </div>
</form>
{% endblock %}
