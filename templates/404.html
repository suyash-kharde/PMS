<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Planwise</title>
<style>
  :root{--bg:#f5f6fa;--surface:#fff;--border:#e2e6ef;--text:#101828;--muted:#667085;--primary:#4f46e5}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0f19;--surface:#131826;--border:#252d40;--text:#e6e9f2;--muted:#94a0b8;--primary:#6366f1}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .box{width:100%;max-width:460px;padding:32px 28px;text-align:center;background:var(--surface);border:1px solid var(--border);
       border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06)}
  .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;
      background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-size:26px;font-weight:700}
  h1{margin:0 0 8px;font-size:22px}
  p{margin:0 0 20px;color:var(--muted);line-height:1.5}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a,button{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:10px;font:inherit;font-size:14px;
      font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .primary{background:var(--primary);border-color:var(--primary);color:#fff}
  small{display:block;margin-top:18px;color:var(--muted)}
</style>
</head>
<body>
  <main class="box">
    <div class="ic">?</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved. Check the address, or go back to where you were.</p>
    <div class="row">
      <button type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Go back</button>
      
      <a class="primary" href="/">Go to dashboard</a>
    </div>
    <small>Error 404</small>
  </main>
</body>
</html>
