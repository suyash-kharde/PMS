{% if people|length > 1 %}
  <form method="get" class="row-actions">
    {% for k, v in keep.items %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
    <select name="user" onchange="this.form.submit()" aria-label="Person">
      {% for p in people %}<option value="{{ p.pk }}" {% if p.pk == target.pk %}selected{% endif %}>{{ p.display_name }}{% if p.pk == user.pk %} (you){% endif %}</option>{% endfor %}
    </select>
  </form>
{% endif %}
