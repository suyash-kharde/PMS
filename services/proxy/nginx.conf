upstream django {
    server web:8000;
}

# ---- project sites: https://<host>/sites/<name>/ -> pms_gateway -> the project's VM ----------------
# Access is decided by Planwise (signed in + can see the project); the answer is cached briefly so a
# page with many files doesn't ask Planwise for each one.
proxy_cache_path /var/cache/nginx/site_auth levels=1 keys_zone=site_auth:2m max_size=20m inactive=10m;

map $request_uri $site_name_from_uri {
    "~^/sites/(?<n>[a-z0-9][a-z0-9_-]{0,31})(?:[/?]|$)" $n;
    default "";
}
# Planwise's own cookies never reach a project site (project apps keep theirs)
map $http_cookie $site_cookie_1 {
    "~^(?<pre>.*?)(?:;\s*)?planwise_sessionid=[^;]*(?<post>.*)$" "$pre$post";
    default $http_cookie;
}
map $site_cookie_1 $site_cookie {
    "~^(?<pre>.*?)(?:;\s*)?planwise_csrftoken=[^;]*(?<post>.*)$" "$pre$post";
    default $site_cookie_1;
}
map $http_upgrade $site_connection {
    default upgrade;
    ""      "";
}

# plain HTTP: redirect everything to HTTPS (service workers and the Push API need a
# secure context on anything that is not localhost)
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:${HTTPS_PORT}$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 512M;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    # media is NOT served from disk here: uploaded recordings go through Django so the
    # login check applies. Django answers Range requests, so seeking still works.
    location /media/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # the service worker must be allowed to control the whole origin
    location = /sw.js {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    # AT-CRM (site at-crm_uat): its e-mail tracking image and Interested / Not Interested links are
    # opened by newsletter recipients who have no Planwise login, so only these two endpoints skip
    # auth_request. The 32-hex tracking id is random; everything else under /sites/ keeps the login.
    # Regex locations win over the plain "location /sites/" prefix. (AT-CRM-3)
    location ~ "^/sites/at-crm_uat/_api/api/email-tracking/(open|response)/[0-9a-f]{32}$" {
        limit_except GET POST { deny all; }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $site_gateway http://gateway:8080;
        proxy_pass $site_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        error_page 500 502 503 504 = @site_down;
    }

    # project sites (see the maps at the top). The gateway is looked up at request time, so nginx and
    # Planwise run normally even when the gateway container is stopped or missing.
    location /sites/ {
        auth_request /_site_auth;
        error_page 401 = @site_login;
        error_page 403 = @site_forbidden;
        error_page 500 502 503 504 = @site_down;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $site_gateway http://gateway:8080;
        proxy_pass $site_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $site_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $site_connection;
        proxy_request_buffering off;
        proxy_intercept_errors off;
    }

    location = /_site_auth {
        internal;
        proxy_pass http://django/api/sites/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Name $site_name_from_uri;
        proxy_cache site_auth;
        proxy_cache_key "$cookie_planwise_sessionid|$site_name_from_uri";
        proxy_cache_valid 204 60s;
        proxy_cache_valid 403 20s;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
        proxy_hide_header Set-Cookie;
    }

    location @site_login {
        return 302 https://$host:${HTTPS_PORT}/login/?next=$uri;
    }
    location @site_forbidden {
        default_type text/html;
        return 403 '<!doctype html><meta charset=utf-8><title>No access</title><body style="font:16px system-ui;max-width:560px;margin:4rem auto;padding:0 1rem"><h1>No access to this site</h1><p>You are signed in to Planwise, but this site belongs to a project you are not part of, or it is no longer published.</p><p><a href="/projects/">Back to Planwise</a></p></body>';
    }
    location @site_down {
        default_type text/html;
        return 503 '<!doctype html><meta charset=utf-8><title>Site unavailable</title><body style="font:16px system-ui;max-width:560px;margin:4rem auto;padding:0 1rem"><h1>This site is temporarily unavailable</h1><p>The project site could not be reached right now. Planwise itself is working. Please try again in a minute.</p><p><a href="javascript:location.reload()">Try again</a> &middot; <a href="/projects/">Back to Planwise</a></p></body>';
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
